version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./stockpilot.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175
    volumes:
      - ./stockpilot.db:/app/stockpilot.db
    restart: unless-stopped
