services:

  # ── PostgreSQL (optional — set USE_POSTGRES=true to enable) ─────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - postgres

  # ── LibreTranslate (self-hosted machine translation) ─────────────────────
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "en,hi,bn"
      LT_DISABLE_WEB_UI: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Main FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:  ${DATABASE_URL:-sqlite:////data/stockpilot.db}
      ADMIN_DB_URL:  ${ADMIN_DB_URL:-sqlite:////data/admin.db}
      JWT_SECRET:    ${JWT_SECRET:-change-me-in-production}
      SEED_DB:       ${SEED_DB:-true}
      CORS_ORIGINS:  "http://localhost:8060,http://localhost:5173"
      GODADDY_API_KEY:    ${GODADDY_API_KEY:-}
      GODADDY_API_SECRET: ${GODADDY_API_SECRET:-}
      TENANT_DOMAIN:      ${TENANT_DOMAIN:-ermarscastar.in}
      SUBDOMAIN_BASE:     ${SUBDOMAIN_BASE:-stockpilot}
      VPS_IP:             ${VPS_IP:-187.127.217.155}
      SMTP_USER:          ${SMTP_USER:-ermarscaster11@gmail.com}
      SMTP_PASS:          ${SMTP_PASS:-ghpv wjdj anvi cxak}
      APP_URL:            ${APP_URL:-https://stockpilot.ermarscastar.in}
      GROQ_API_KEY:       ${GROQ_API_KEY:-}
    volumes:
      - db_data:/data
      - uploads:/data/uploads
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Admin FastAPI Backend ─────────────────────────────────────────────────
  admin-backend:
    build:
      context: ./backend-admin
    restart: unless-stopped
    environment:
      ADMIN_DB_URL:   ${ADMIN_DB_URL:-sqlite:////data/admin.db}
      TENANT_DB_URL:  ${DATABASE_URL:-sqlite:////data/stockpilot.db}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      JWT_SECRET:     ${JWT_SECRET:-change-me-in-production}
      SEED_DB:        ${SEED_DB:-true}
      ADMIN_CORS_ORIGINS: "http://localhost:8061"
      SMTP_USER:      ${SMTP_USER:-ermarscaster11@gmail.com}
      SMTP_PASS:      ${SMTP_PASS:-ghpv wjdj anvi cxak}
    volumes:
      - db_data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Main Frontend (React + Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8060}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Admin Frontend (React + Nginx) ────────────────────────────────────────
  admin-frontend:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8061}:80"
    depends_on:
      admin-backend:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  uploads:
    driver: local
  pg_data:
    driver: local
