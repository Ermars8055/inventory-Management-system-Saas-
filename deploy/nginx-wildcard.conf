# Wildcard subdomain routing for tenant apps
# Place at: /etc/nginx/sites-enabled/stockpilot-wildcard.conf on VPS
# Requires: wildcard SSL cert for *.stockpilot.ermarscastar.in

server {
    listen 443 ssl;
    server_name *.stockpilot.ermarscastar.in;

    ssl_certificate     /etc/letsencrypt/live/stockpilot.ermarscastar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockpilot.ermarscastar.in/privkey.pem;

    # Proxy to the Docker frontend container
    location / {
        proxy_pass         http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

server {
    listen 80;
    server_name *.stockpilot.ermarscastar.in;
    return 301 https://$host$request_uri;
}
